<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Voice-native SRE console for PagerDuty" />
    <meta name="theme-color" content="#000000" />
    <!-- Added to an iPhone home screen, the page opens without Safari's bars:
         the only way to get a full-screen stage there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paige" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Paige — SRE Console</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1011'/%3E%3Crect x='14' y='7' width='4' height='12' rx='2' fill='%2306AC38'/%3E%3Cpath d='M10 15a6 6 0 0 0 12 0' stroke='%2306AC38' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 21v4' stroke='%2306AC38' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Resolves the theme before first paint. A flash of the wrong one is far
      // more jarring than the few bytes this costs, so it is inline and blocking.
      (function () {
        try {
          // Dark unless the operator chose otherwise; "system" must be chosen.
          var stored = localStorage.getItem('srevoice.theme');
          document.documentElement.dataset.theme =
            stored === 'light'
              ? 'light'
              : stored === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
