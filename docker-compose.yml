services:
  srevoice-app:
    build: .
    container_name: srevoice-app
    restart: unless-stopped
    ports:
      - '5280:5280'
    environment:
      NODE_ENV: production
      PORT: 5280
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Required. Generate with: openssl rand -base64 32
      SREVOICE_MASTER_KEY: ${SREVOICE_MASTER_KEY:?set SREVOICE_MASTER_KEY in .env}
      # Strongly recommended once this is reachable from anywhere but localhost.
      SREVOICE_ACCESS_TOKEN: ${SREVOICE_ACCESS_TOKEN:-}
    volumes:
      - srevoice-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5280/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  srevoice-data:
    name: srevoice-data
